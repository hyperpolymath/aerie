#
# diag-gitleaks.yml — ONE-SHOT DIAGNOSTIC (never merge to main).
#
# Why: the estate secret-scanner-reusable gating step fails on main with
# exit 1, but this sandbox cannot read Actions job logs (egress-blocked
# results-receiver host) and cannot download the gitleaks binary locally.
# This workflow runs the IDENTICAL pinned scan in CI and writes the
# findings into $GITHUB_STEP_SUMMARY, which IS readable via the
# api.github.com check-run output endpoint.
name: Diag Gitleaks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/diag-gitleaks.yml']

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install gitleaks (pinned + checksum-verified)
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.18.4
          SHA256=ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d
          cd "$RUNNER_TEMP"
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          ./gitleaks version

      - name: Stage estate gitleaks baseline (as the reusable does)
        run: |
          set -euo pipefail
          gh api "repos/hyperpolymath/standards/contents/config/gitleaks/estate-baseline.toml?ref=e13e2ea3dbbc9c7815e39c3749b4480514f555a6" -q .content \
            | base64 -d > .gitleaks-estate.toml
          test -s .gitleaks-estate.toml

      - name: Run the exact gating scan, dump findings to summary
        run: |
          set -uo pipefail
          CONFIG=".gitleaks-estate.toml"
          [ -f .gitleaks.toml ] && CONFIG=".gitleaks.toml"
          "$RUNNER_TEMP/gitleaks" detect \
            --source . \
            --no-git \
            --redact \
            --no-banner \
            --verbose \
            --config "$CONFIG" \
            --exit-code 0 > "$RUNNER_TEMP/scan.txt" 2>&1
          RC=$?
          {
            echo "### diag-gitleaks: exit=${RC} config=${CONFIG}"
            echo ""
            echo '```'
            cat "$RUNNER_TEMP/scan.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Also surface each finding as an annotation for the API path.
          grep -E '^ *Finding:|^ *File:' "$RUNNER_TEMP/scan.txt" | head -100 || true
          exit 0
# touch 2026-09-25T21:58:01Z
