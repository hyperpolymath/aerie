# SPDX-License-Identifier: MPL-2.0
# Primary CI/CD - GitLab is the source of truth

stages:
  - security
  - lint
  - test
  - build


# ==================
# Security Scanning
# ==================

trivy:
  stage: security
  image: aquasec/trivy:latest
  script:
    - trivy fs --exit-code 0 --severity HIGH,CRITICAL --format table .
    - trivy fs --exit-code 1 --severity CRITICAL .
  allow_failure: false

gitleaks:
  stage: security
  image: zricethezav/gitleaks:latest
  script:
    - gitleaks detect --source . --verbose --redact
  allow_failure: false

semgrep:
  stage: security
  image: returntocorp/semgrep
  script:
    - semgrep --config auto --error .
  allow_failure: true



mix-audit:
  stage: security
  image: elixir:latest
  script:
    - mix local.hex --force
    - mix archive.install hex mix_audit --force
    - mix deps.get
    - mix deps.audit
  rules:
    - exists:
        - mix.exs
  allow_failure: true

# ==================
# Linting
# ==================



mix-format:
  stage: lint
  image: elixir:latest
  script:
    - mix format --check-formatted
  rules:
    - exists:
        - mix.exs

credo:
  stage: lint
  image: elixir:latest
  script:
    - mix local.hex --force
    - mix deps.get
    - mix credo --strict
  rules:
    - exists:
        - mix.exs
  allow_failure: true

# ==================
# Testing
# ==================


mix-test:
  stage: test
  image: elixir:latest
  script:
    - mix local.hex --force
    - mix deps.get
    - mix test
  rules:
    - exists:
        - mix.exs

# ==================
# Build
# ==================


mix-build:
  stage: build
  image: elixir:latest
  script:
    - mix local.hex --force
    - mix deps.get
    - MIX_ENV=prod mix compile
  rules:
    - exists:
        - mix.exs
