# SPDX-License-Identifier: MPL-2.0
#
# Aerie toolchain pins. Every name here resolves in the mise registry
# (checked 2026-09-23); versions are pinned to what the build and CI use,
# so local and CI agree (rsr-template-repo mise discipline).
#
# Estate language policy (standards 3-practice/LANGUAGE-POLICY.adoc):
#   * banned for new work: Python, V, ATS2, ReScript, Go, Java/Kotlin,
#     Swift, Deno (ruling 2026-09-22), Makefiles (use just), Nix (retired)
#   * JS/TS runs on Bun (tier 1 runtime)
# The previous kitchen-sink version of this file pinned python/go/java/
# denojs/make and carried a deprecated [alias] section of phantom tasks.

[tools]
# Gateway + FFI (build.zig requires 0.15.2+)
zig = "0.15.2"

# Tracked-drift crate only (src/api/rust) — do not extend; keep resolvable
# so `just test` can still exercise the existing suite.
rust = "stable"

# Core experiment (src/core/Aerie.jl)
julia = "stable"

# Estate task runner (Justfile; no Makefiles)
just = "latest"

# JS glue runtime for the HUD (aerie_tea.js) — estate tier-1 runtime
bun = "latest"

# Lint / format / secret scanning (wired by Justfile lint/security recipes)
shellcheck = "latest"
typos = "latest"
gitleaks = "latest"
trivy = "latest"

# Idris2 (ABI + tests/idris2) is not reliably resolvable in the mise
# registry; install from https://www.idris2.org/ or via Nix-free package
# manager of the host, then `just test` picks it up on PATH.

[env]
NODE_ENV = "development"
